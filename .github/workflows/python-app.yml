name: Run C Samp Script

on:
  workflow_dispatch:

jobs:
  build_and_run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile C script
      run: |
        gcc rflood.c -o rflood

    - name: Run compiled script
      run: |
        sudo ./rflood
